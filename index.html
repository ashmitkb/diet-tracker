<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #38393B;
    --bg-deep: #202123;
    --panel: #2B2C2E;
    --panel-2: #333537;
    --border: rgba(255,255,255,0.09);
    --ink: #F3F1ED;
    --ink-dim: #9C9A97;
    --glass-fill: rgba(255,255,255,0.07);
    --glass-fill-strong: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.16);
    --glass-hi: rgba(255,255,255,0.4);
    --amber-1: #F0B45A; --amber-2: #C97A1E;
    --teal-1: #5FD9C4; --teal-2: #1E8E7A;
    --violet-1: #B29CFF; --violet-2: #6C4FD1;
    --blue-1: #86BBFF; --blue-2: #3E70C9;
    --danger: #E2665B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg-deep);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }
  body { min-height: 100vh; display: flex; justify-content: center; }
  .device {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: radial-gradient(120% 55% at 50% -10%, #46474A 0%, var(--bg) 55%, var(--bg-deep) 100%);
    padding: 20px 16px 110px;
  }

  /* ---- top bar ---- */
  .top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .top-row .date { font-size:13px; color:var(--ink-dim); font-weight:500; }

  /* ---- glass hero card ---- */
  .hero-card {
    position: relative;
    background: linear-gradient(160deg, var(--glass-fill-strong), var(--glass-fill));
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 16px 18px 8px;
    box-shadow: 0 20px 44px rgba(0,0,0,0.32), inset 0 1px 0 var(--glass-hi), inset 0 -14px 24px -18px rgba(0,0,0,0.4);
    overflow: hidden;
    margin-bottom: 22px;
  }
  .hero-card::after {
    content:''; position:absolute; top:0; left:0; right:0; height:60%;
    background: radial-gradient(120% 100% at 30% -20%, rgba(255,255,255,0.28), transparent 65%);
    pointer-events:none;
  }
  .hero-card > * { position:relative; z-index:1; }
  .hero-row1 { display:flex; align-items:center; justify-content:space-between; }
  .mark { width:20px; height:20px; border-radius:6px; background:linear-gradient(150deg, var(--amber-1), var(--amber-2)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -3px 4px rgba(0,0,0,0.2); flex-shrink:0; }
  .title-group { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; }
  .log-btn {
    background: linear-gradient(180deg, #FFFFFF, #E7E3DC);
    color:#241A08; border:none; font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px;
    padding:8px 14px; border-radius:999px; cursor:pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 2px rgba(0,0,0,0.1), 0 3px 8px rgba(0,0,0,0.28);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .log-btn:active { transform: translateY(1px); box-shadow: inset 0 1px 3px rgba(0,0,0,0.25); }
  .hero-divider { height:1px; background:var(--glass-border); margin:14px 0 12px; }
  .hero-stat .num { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:36px; line-height:1; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }
  .hero-stat .num.over { color: var(--danger); }
  .hero-stat .cap { font-size:12.5px; color:var(--ink-dim); margin-top:5px; }
  .hero-macros-view { display:none; font-size:13px; }
  .hero-macros-view.show { display:block; }
  .hero-macros-view .row { display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid var(--glass-border); }
  .hero-macros-view .row:first-child { border-top:none; }
  .hero-tabs { display:flex; gap:6px; margin-top:14px; }
  .hero-tab { font-size:13px; padding:8px 14px 9px; border-radius:999px; color:var(--ink-dim); font-weight:500; cursor:pointer; background:none; border:none; font-family:'Inter',sans-serif; }
  .hero-tab.on { color:var(--ink); background:var(--glass-fill-strong); font-weight:600; }

  section { margin-bottom:24px; }
  .section-title { font-size:15px; font-weight:700; margin:0 0 12px; font-family:'Space Grotesk',sans-serif; }

  /* ---- gradient bevel tiles (macros) ---- */
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile {
    border-radius:16px; padding:14px 15px 15px; position:relative; overflow:hidden; min-height:96px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -10px 16px -10px rgba(0,0,0,0.35), 0 8px 18px rgba(0,0,0,0.2);
  }
  .tile::after {
    content:''; position:absolute; top:0; left:0; right:0; height:55%;
    background: radial-gradient(110% 100% at 25% -10%, rgba(255,255,255,0.35), transparent 70%);
    pointer-events:none;
  }
  .tile .lbl { font-size:12.5px; font-weight:500; opacity:0.85; position:relative; z-index:1; }
  .tile .num { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; margin-top:24px; position:relative; z-index:1; }
  .tile.protein { background:linear-gradient(155deg, var(--amber-1), var(--amber-2)); color:#2A1904; }
  .tile.carbs   { background:linear-gradient(155deg, var(--teal-1), var(--teal-2)); color:#06231D; }
  .tile.fat     { background:linear-gradient(155deg, var(--violet-1), var(--violet-2)); color:#1C1240; }
  .tile.fiber   { background:linear-gradient(155deg, var(--blue-1), var(--blue-2)); color:#0C2549; }
  .tile-ring { position:absolute; top:10px; right:10px; width:34px; height:34px; }
  .tile-ring circle { fill:none; stroke-width:3.5; }
  .tile-ring .track { stroke: rgba(0,0,0,0.15); }
  .tile-ring .fill { stroke: rgba(0,0,0,0.55); stroke-linecap:round; }
  .tile-bar { position:absolute; left:15px; right:15px; top:44px; height:4px; border-radius:3px; background:rgba(0,0,0,0.15); z-index:1; }
  .tile-bar .fill { height:100%; border-radius:3px; background:rgba(0,0,0,0.5); }

  /* neutral bevel tile (streaks / weight stats) */
  .ntile {
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border-radius:14px; padding:12px; text-align:center; position:relative; overflow:hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -8px 14px -10px rgba(0,0,0,0.4), 0 6px 14px rgba(0,0,0,0.25);
  }
  .ntile .num { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; color:var(--amber-1); }
  .ntile .lbl { font-size:11.5px; color:var(--ink-dim); margin-top:2px; }
  .ntile .best { font-size:10.5px; color:var(--ink-dim); margin-top:4px; }

  /* ---- quest log timeline ---- */
  .timeline { position:relative; padding-left:18px; }
  .timeline::before { content:''; position:absolute; left:4px; top:6px; bottom:6px; width:1px; background:var(--border); }
  .t-item { position:relative; padding:0 0 16px 14px; cursor:pointer; }
  .t-item:last-child { padding-bottom:0; }
  .t-item::before { content:''; position:absolute; left:-18px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--panel-2); border:1px solid var(--border); }
  .t-item.done::before { background:var(--teal-1); border-color:var(--teal-1); }
  .t-item .time { font-size:11.5px; color:var(--ink-dim); font-weight:600; }
  .t-item .title { font-size:14px; font-weight:600; margin-top:1px; }
  .t-item.done .title { color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--border); }
  .t-item .note { font-size:12.5px; color:var(--ink-dim); margin-top:2px; }

  /* ---- solid panels (forms/lists) ---- */
  .panel {
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 14px rgba(0,0,0,0.2);
  }
  .ai-form textarea {
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px; color:var(--ink);
    padding:10px; font-size:13.5px; font-family:'Inter',sans-serif; width:100%; resize:vertical; min-height:54px;
  }
  .ai-row { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .photo-btn { background:var(--panel-2); border:1px solid var(--border); color:var(--ink-dim); border-radius:10px; padding:10px 12px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .photo-preview { display:none; align-items:center; gap:8px; margin-top:8px; font-size:12.5px; color:var(--ink-dim); }
  .photo-preview.show { display:flex; }
  .photo-preview img { width:36px; height:36px; object-fit:cover; border-radius:8px; border:1px solid var(--border); }
  .link-btn { background:none; border:none; color:var(--ink-dim); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:0; font-family:'Inter',sans-serif; }
  .link-btn:hover { color:var(--ink); }
  .estimate-btn {
    width:100%;
    background: linear-gradient(160deg, var(--teal-1), var(--teal-2));
    color:#06231D; border:none; border-radius:10px; padding:10px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 3px 8px rgba(0,0,0,0.25);
  }
  .estimate-btn:disabled { opacity:0.6; }
  .ai-status { font-size:12.5px; color:var(--ink-dim); margin-top:8px; min-height:16px; }
  .ai-status.error { color:var(--danger); }
  .keyset { margin-top:10px; }
  .keyset.hidden { display:none; }
  .keyset input { background:var(--panel-2); border:1px solid var(--border); border-radius:8px; color:var(--ink); padding:8px 10px; font-size:13px; width:100%; margin-top:6px; }
  .db-fallback.hidden { display:none; }
  .manual-form { margin-top:14px; }
  .manual-form.hidden { display:none; }
  .food-form { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .food-form input, .wk-form input { background:var(--panel-2); border:1px solid var(--border); border-radius:8px; color:var(--ink); padding:9px 10px; font-size:13.5px; width:100%; }
  .food-form .name-field, .wk-form .name-field { grid-column:1/-1; }
  .add-btn {
    grid-column:1/-1; background:linear-gradient(180deg, var(--amber-1), var(--amber-2)); color:#2A1904; border:none;
    border-radius:8px; padding:10px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:2px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 3px 8px rgba(0,0,0,0.25);
  }
  .entry-list { display:flex; flex-direction:column; gap:0; }
  .entry { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border); }
  .entry:first-child { border-top:none; }
  .entry .name { font-size:13.5px; font-weight:600; }
  .entry .macros-mini, .entry .meta { font-size:12px; color:var(--ink-dim); margin-top:1px; }
  .entry .remove { background:none; border:none; color:var(--ink-dim); font-size:18px; cursor:pointer; padding:4px 6px; line-height:1; }
  .entry .remove:hover { color:var(--danger); }
  .empty-note { font-size:13px; color:var(--ink-dim); padding:6px 0; }
  .footer-row { display:flex; justify-content:space-between; margin-top:14px; }
  .goals-panel { margin-top:10px; }
  .goals-panel.hidden { display:none; }
  .goals-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .goals-grid label { font-size:11.5px; color:var(--ink-dim); display:block; margin-bottom:4px; }

  /* ---- history chart ---- */
  .hist-chart { display:flex; gap:8px; align-items:flex-end; height:120px; margin-bottom:4px; }
  .hist-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .hist-bar-track { width:100%; max-width:28px; height:100%; background:var(--panel-2); border-radius:4px; display:flex; align-items:flex-end; overflow:hidden; }
  .hist-bar-fill { width:100%; background:linear-gradient(180deg, var(--amber-1), var(--amber-2)); border-radius:4px 4px 0 0; transition:height .3s ease; min-height:2px; }
  .hist-bar-fill.good { background:linear-gradient(180deg, var(--teal-1), var(--teal-2)); }
  .hist-bar-label { font-size:10.5px; color:var(--ink-dim); margin-top:4px; }
  .hist-legend { display:flex; gap:14px; font-size:11.5px; color:var(--ink-dim); margin-bottom:14px; }
  .hist-legend .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
  .avg-row { display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-top:1px solid var(--border); }
  .avg-row:first-child { border-top:none; }
  .avg-row .val { font-weight:700; font-family:'Space Grotesk',sans-serif; }

  /* ---- weight log ---- */
  .weight-form { display:flex; gap:8px; margin-bottom:14px; }
  .weight-form input { flex:1; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; color:var(--ink); padding:9px 10px; font-size:13.5px; }
  .weight-form button { background:linear-gradient(180deg, var(--amber-1), var(--amber-2)); color:#2A1904; border:none; border-radius:8px; padding:0 16px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .weight-stats { display:flex; justify-content:space-between; margin-bottom:14px; }
  .weight-stats .stat { text-align:center; flex:1; }
  .weight-stats .stat .num { font-size:22px; font-weight:700; font-family:'Space Grotesk',sans-serif; }
  .weight-stats .stat .lbl { font-size:11px; color:var(--ink-dim); margin-top:2px; }
  .weight-svg { width:100%; height:90px; }

  .streak-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .badge-row { display:flex; gap:8px; flex-wrap:wrap; }
  .badge { font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:999px; border:1px solid var(--border); color:var(--ink-dim); background:var(--panel-2); }
  .badge.unlocked { color:#2A1904; background:linear-gradient(180deg, var(--amber-1), var(--amber-2)); border-color:transparent; }

  .wk-form { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .pr-list { display:flex; flex-direction:column; gap:0; }
  .pr-row { display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--border); font-size:13.5px; }
  .pr-row:first-child { border-top:none; }
  .pr-row .best { color:var(--teal-1); font-weight:700; }

  /* ---- food database search ---- */
  .db-search input {
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px; color:var(--ink);
    padding:10px 12px; font-size:13.5px; width:100%;
  }
  .db-search-note { font-size:11.5px; color:var(--ink-dim); margin-top:6px; }
  .db-results { display:none; flex-direction:column; margin-top:8px; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
  .db-results.show { display:flex; }
  .db-result {
    display:flex; justify-content:space-between; align-items:center; background:var(--panel-2);
    border:none; border-bottom:1px solid var(--border); color:var(--ink); padding:10px 12px; font-size:13px; cursor:pointer; text-align:left;
  }
  .db-result:last-child { border-bottom:none; }
  .db-result:active { background:var(--panel); }
  .db-result .db-kcal { color:var(--ink-dim); font-size:12px; flex-shrink:0; margin-left:10px; }
  .db-confirm { display:none; margin-top:10px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:12px; }
  .db-confirm.show { display:block; }
  .db-confirm-row { display:flex; justify-content:space-between; align-items:center; }
  .db-confirm-row .name { font-size:13.5px; font-weight:600; }
  .qty-stepper { display:flex; align-items:center; gap:10px; }
  .qty-stepper button {
    width:26px; height:26px; border-radius:8px; border:1px solid var(--border); background:var(--panel);
    color:var(--ink); font-size:15px; cursor:pointer; line-height:1;
  }
  .db-confirm-meta { font-size:12px; color:var(--ink-dim); margin-top:8px; }
  .or-divider {
    display:flex; align-items:center; gap:10px; margin:16px 0 14px; font-size:12px; color:var(--ink-dim);
    background:none; border:none; width:100%; padding:0; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .or-divider:hover { color:var(--ink); }
  .or-divider::before, .or-divider::after { content:''; flex:1; height:1px; background:var(--border); }

  /* ---- liquid glass bottom nav ---- */
  .navbar-wrap { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; padding:0 18px calc(18px + env(safe-area-inset-bottom)); pointer-events:none; }
  .navbar {
    pointer-events:auto; position:relative; width:100%; max-width:394px; display:flex;
    background: linear-gradient(160deg, var(--glass-fill-strong), var(--glass-fill));
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border:1px solid var(--glass-border); border-radius:999px; padding:6px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.4), inset 0 1px 0 var(--glass-hi);
  }
  .nav-indicator {
    position:absolute; top:6px; bottom:6px; width:calc(33.333% - 4px); left:6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.06));
    border:1px solid var(--glass-border); border-radius:999px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -1px 0 rgba(0,0,0,0.2), 0 3px 8px rgba(0,0,0,0.3);
    transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);
  }
  .nav-item { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 0 8px; background:none; border:none; color:var(--ink-dim); font-size:11px; font-weight:600; cursor:pointer; }
  .nav-item.active { color:var(--ink); }
  .nav-item svg { width:18px; height:18px; }
  .tab-page.hidden { display:none; }
</style>
</head>
<body>
<div class="device">

  <div class="top-row">
    <div class="date" id="dateLabel"></div>
  </div>

  <div class="hero-card">
    <div class="hero-row1">
      <div class="title-group"><span class="mark"></span><span>Today</span></div>
      <button class="log-btn" id="logMealBtn">Log meal</button>
    </div>
    <div class="hero-divider"></div>
    <div id="heroOverview">
      <div class="hero-stat">
        <div class="num" id="calRemaining">–</div>
        <div class="cap" id="calSub">kcal remaining</div>
      </div>
    </div>
    <div class="hero-macros-view" id="heroMacros">
      <div class="row"><span>Protein</span><span id="hmPro">–</span></div>
      <div class="row"><span>Carbs</span><span id="hmCarb">–</span></div>
      <div class="row"><span>Fat</span><span id="hmFat">–</span></div>
      <div class="row"><span>Fiber</span><span id="hmFiber">–</span></div>
    </div>
    <div class="hero-tabs">
      <button class="hero-tab on" id="heroTabOverview">Overview</button>
      <button class="hero-tab" id="heroTabMacros">Macros</button>
    </div>
  </div>

  <!-- TODAY -->
  <div class="tab-page" id="tab-today">
    <section>
      <div class="section-title">Macros</div>
      <div class="tiles" id="macroTiles"></div>
    </section>

    <section>
      <div class="section-title">Quest Log</div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section id="foodLogSection">
      <div class="section-title">Food Log</div>
      <div class="panel">
        <div class="ai-form">
          <textarea id="mealDesc" placeholder="What did you eat? e.g. 3 rotis, dal tadka, aloo sabzi, small bowl rice"></textarea>
          <div class="ai-row">
            <button class="photo-btn" id="photoBtn">📷 Add photo</button>
            <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
          </div>
          <div class="photo-preview" id="photoPreview">
            <img id="photoThumb" src="">
            <span>Photo attached</span>
            <button class="link-btn" id="clearPhoto">remove</button>
          </div>
          <button class="estimate-btn" id="estimateBtn">Estimate with AI &amp; add to log</button>
          <div class="ai-status" id="aiStatus"></div>
          <div class="keyset hidden" id="keyset">
            <button class="link-btn" id="keyToggle">Gemini API key: <span id="keyStatus">not set</span> — edit</button>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
            <div class="db-search-note">Free at aistudio.google.com — no card needed</div>
            <button class="add-btn" id="saveKeyBtn" style="margin-top:8px;">Save key</button>
          </div>
        </div>

        <button class="or-divider" id="dbFallbackToggle" type="button">can't find it, or rate-limited?</button>

        <div class="db-fallback hidden" id="dbFallback">
          <div class="db-search">

function pad2(n){ return String(n).padStart(2,'0'); }
function dateKeyOffset(offset){ const d=new Date(); d.setDate(d.getDate()-offset); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function dayLabelOffset(offset){ const d=new Date(); d.setDate(d.getDate()-offset); return d.toLocaleDateString('en-US',{weekday:'short'}); }
function isConsecutiveDates(a,b){ return (new Date(b)-new Date(a))===86400000; }
const DATE_KEY = dateKeyOffset(0);

let goals = { ...DEFAULT_GOALS };
let entries = [];
let checked = {};
let wkEntries = [];

/* ---- localStorage-backed persistence (drop-in for the old artifact storage API) ---- */
async function safeGet(key){ try { const v=localStorage.getItem(key); return v?JSON.parse(v):null; } catch(e){ return null; } }
async function safeSet(key,val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){ console.error('storage set failed', e); } }
async function safeList(prefix){ try { return Object.keys(localStorage).filter(k=>k.startsWith(prefix)); } catch(e){ return []; } }

function fmtDate(){ const d=new Date(); return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }

/* ---------- TODAY ---------- */
function computeTotals(list){
  return list.reduce((a,e)=>({cal:a.cal+(e.cal||0),pro:a.pro+(e.pro||0),carb:a.carb+(e.carb||0),fat:a.fat+(e.fat||0),fiber:a.fiber+(e.fiber||0)}),{cal:0,pro:0,carb:0,fat:0,fiber:0});
}

function renderHero(){
  const totals = computeTotals(entries);
  const remaining = goals.cal - totals.cal;
  const el = document.getElementById('calRemaining');
  el.textContent = Math.abs(Math.round(remaining)).toLocaleString();
  el.classList.toggle('over', remaining<0);
  document.getElementById('calSub').textContent = remaining<0
    ? `${Math.round(-remaining)} kcal over target`
    : 'kcal remaining';

  document.getElementById('hmPro').textContent = `${Math.round(totals.pro)} / ${goals.pro}g`;
  document.getElementById('hmCarb').textContent = `${Math.round(totals.carb)} / ${goals.carb}g`;
  document.getElementById('hmFat').textContent = `${Math.round(totals.fat)} / ${goals.fat}g`;
  document.getElementById('hmFiber').textContent = `${Math.round(totals.fiber)} / ${goals.fiber}g`;

  const tileDefs = [
    { key:'pro', cls:'protein', label:'Protein', unit:'g', accent:'ring' },
    { key:'carb', cls:'carbs', label:'Carbs', unit:'g', accent:'bar' },
    { key:'fat', cls:'fat', label:'Fat', unit:'g', accent:'none' },
    { key:'fiber', cls:'fiber', label:'Fiber', unit:'g', accent:'none' }
  ];
  document.getElementById('macroTiles').innerHTML = tileDefs.map(t=>{
    const val = totals[t.key], goal = goals[t.key];
    const pct = Math.min(100,(val/goal)*100);
    let accentHtml = '';
    if (t.accent==='ring'){
      const c = 2*Math.PI*16;
      accentHtml = `<svg class="tile-ring" viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="16"/><circle class="fill" cx="20" cy="20" r="16" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}" transform="rotate(-90 20 20)"/></svg>`;
    } else if (t.accent==='bar'){
      accentHtml = `<div class="tile-bar"><div class="fill" style="width:${pct}%"></div></div>`;
    }
    return `<div class="tile ${t.cls}">${accentHtml}<div class="lbl">${t.label}</div><div class="num">${Math.round(val)}${t.unit}</div></div>`;
  }).join('');
}

function renderEntries(){
  const list = document.getElementById('entryList');

let attachedPhotoB64 = null;
function resizeImageToBase64(file, maxDim=800){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let {width,height} = img;
        if (width>height && width>maxDim){ height=Math.round(height*maxDim/width); width=maxDim; }
        else if (height>maxDim){ width=Math.round(width*maxDim/height); height=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const NUTRITION_SYSTEM_PROMPT = `You are a nutrition estimator specialized in Indian home-cooked and restaurant food. You'll get a text description and/or photo of a meal. Identify each distinct food item and estimate calories and macros for the portion described or shown, using typical Indian serving sizes and preparation (roti size, rice bowl size, oil/ghee use) as reference.
Respond with ONLY valid JSON, no markdown, no code fences, no explanation, in exactly this shape:
{"items":[{"name":"string","cal":number,"pro":number,"carb":number,"fat":number,"fiber":number}]}
cal is kcal; pro/carb/fat/fiber are grams. Round to the nearest whole number. If something can't be identified precisely, give your best reasonable estimate rather than skipping it.`;

function getApiKey(){ return localStorage.getItem('gemini_api_key') || ''; }
function setApiKeyStored(k){ localStorage.setItem('gemini_api_key', k.trim()); }

function refreshKeyStatus(){
  document.getElementById('keyStatus').textContent = getApiKey() ? 'set' : 'not set';
}

async function estimateMeal(){
  const desc = document.getElementById('mealDesc').value.trim();
  const statusEl = document.getElementById('aiStatus');
  const btn = document.getElementById('estimateBtn');
  const key = getApiKey();

  if (!key){
    document.getElementById('keyset').classList.remove('hidden');
    statusEl.classList.add('error');
    statusEl.textContent = 'Add your free Gemini API key first, then try again.';
    return;
  }
  if (!desc && !attachedPhotoB64){
    statusEl.textContent = 'Describe the meal or attach a photo first.';
    statusEl.classList.add('error');
    return;
  }
  btn.disabled = true;
  statusEl.classList.remove('error');
  statusEl.textContent = 'Estimating…';

  try {
    const parts = [{ text: desc || 'Estimate the meal shown in the photo.' }];
    if (attachedPhotoB64){
      parts.push({ inline_data: { mime_type:'image/jpeg', data: attachedPhotoB64.split(',')[1] } });
    }

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts:[{ text: NUTRITION_SYSTEM_PROMPT }] },
        contents: [{ parts }],
        generationConfig: { responseMimeType:'application/json' }
      })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error.message || 'API error');
    const text = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
    if (!text) throw new Error('no response');
    const cleaned = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);
    if (!parsed.items || !parsed.items.length) throw new Error('no items');

    parsed.items.forEach(it=>{
      entries.push({ name: it.name||'Food item', cal:Number(it.cal)||0, pro:Number(it.pro)||0, carb:Number(it.carb)||0, fat:Number(it.fat)||0, fiber:Number(it.fiber)||0 });
    });
    await safeSet(`foodlog:${DATE_KEY}`, entries);
    renderEntries(); renderHero();
    statusEl.textContent = `Added ${parsed.items.length} item${parsed.items.length>1?'s':''} — check the numbers below.`;
    document.getElementById('mealDesc').value = '';
    clearPhoto();
  } catch(err){
    statusEl.classList.add('error');
    statusEl.textContent = "Couldn't estimate that — check your Gemini key, try the database search below, or enter it manually.";
  } finally {
    btn.disabled = false;
  }
}

/* ---------- PROGRESS ---------- */
async function loadAndRenderProgress(){
  const foodKeys = await safeList('foodlog:');
  const dateSet = new Set(foodKeys.map(k=>k.replace('foodlog:','')));
  const last35 = [...dateSet].sort().slice(-35);
  const dailyMap = {};
  for (const d of last35){
    const log = (await safeGet(`foodlog:${d}`)) || [];
    dailyMap[d] = computeTotals(log);
  }
  dailyMap[DATE_KEY] = computeTotals(entries);

  renderHistoryChart(dailyMap);
  renderStreaks(dailyMap, last35.includes(DATE_KEY) ? last35 : [...last35, DATE_KEY].sort());
  const weightLog = (await safeGet('weightlog')) || [];
  renderWeightSection(weightLog);
}

function renderHistoryChart(dailyMap){
  const last7 = [6,5,4,3,2,1,0].map(off=>({ key:dateKeyOffset(off), label: off===0?'Today':dayLabelOffset(off) }));
  const values = last7.map(d=>dailyMap[d.key]||{cal:0,pro:0});
  const maxVal = Math.max(goals.cal, ...values.map(v=>v.cal), 1);

  document.getElementById('histChart').innerHTML = last7.map((d,i)=>{
    const v = values[i];
    const pct = v.cal>0 ? Math.max(4,(v.cal/maxVal)*100) : 2;
    const good = v.pro>=goals.pro && v.pro>0;
    return `<div class="hist-bar-col" title="${Math.round(v.cal)} kcal · ${Math.round(v.pro)}g protein">
      <div class="hist-bar-track"><div class="hist-bar-fill ${good?'good':''}" style="height:${pct}%"></div></div>
      <div class="hist-bar-label">${d.label}</div></div>`;
  }).join('');

  const loggedDays = values.filter(v=>v.cal>0);
  const avgPanel = document.getElementById('avgPanel');
  if (loggedDays.length===0){
    avgPanel.innerHTML = '<div class="empty-note">Log a few days to see your weekly average.</div>';
  } else {
    const avgCal = loggedDays.reduce((a,v)=>a+v.cal,0)/loggedDays.length;
    const avgPro = loggedDays.reduce((a,v)=>a+v.pro,0)/loggedDays.length;
    avgPanel.innerHTML = `<div class="avg-row"><span>Avg calories (${loggedDays.length}d logged)</span><span class="val">${Math.round(avgCal)}</span></div>
      <div class="avg-row"><span>Avg protein</span><span class="val">${Math.round(avgPro)}g</span></div>`;
  }
}

function renderStreaks(dailyMap, allDatesAsc){
  function streakFrom(startOffset, predicate){
    let streak=0, offset=startOffset;
    while(true){ const totals=dailyMap[dateKeyOffset(offset)]; if (totals && predicate(totals)){ streak++; offset++; } else break; }
    return streak;
  }
  function currentStreak(predicate){ let s=streakFrom(0,predicate); if (s===0) s=streakFrom(1,predicate); return s; }
  function longestStreak(predicate){
    let best=0,current=0,prev=null;
    for (const d of allDatesAsc){
      const totals=dailyMap[d];
      if (totals && predicate(totals)){ current=(prev && isConsecutiveDates(prev,d))?current+1:1; best=Math.max(best,current); prev=d; }
      else { current=0; prev=null; }
    }
    return best;
  }
  const loggingPredicate = t=>t.cal>0;
  const proteinPredicate = t=>t.pro>=goals.pro;
  const curLog=currentStreak(loggingPredicate), bestLog=longestStreak(loggingPredicate);
  const curPro=currentStreak(proteinPredicate), bestPro=longestStreak(proteinPredicate);

  document.getElementById('streakGrid').innerHTML = `
    <div class="ntile"><div class="num">${curLog}</div><div class="lbl">Day logging streak</div><div class="best">Best: ${bestLog}</div></div>
    <div class="ntile"><div class="num">${curPro}</div><div class="lbl">Protein-goal streak</div><div class="best">Best: ${bestPro}</div></div>`;

  const thresholds=[3,7,14,30];
  document.getElementById('badgeRow').innerHTML = thresholds.map(t=>`<span class="badge ${bestPro>=t?'unlocked':''}">${t}-day protein streak</span>`).join('');
}

async function logWeight(){
  const val = Number(document.getElementById('wInput').value);
  if (!val) return;
  let log = (await safeGet('weightlog')) || [];
  const idx = log.findIndex(e=>e.date===DATE_KEY);
  if (idx>=0) log[idx].weight=val; else log.push({date:DATE_KEY, weight:val});
  log.sort((a,b)=>a.date.localeCompare(b.date));
  await safeSet('weightlog', log);
  document.getElementById('wInput').value = '';
  renderWeightSection(log);
}

function renderWeightSection(log){
  const statsEl = document.getElementById('weightStats');
  const chartWrap = document.getElementById('weightChartWrap');
  if (log.length===0){ statsEl.innerHTML='<div class="empty-note">Log your weight to start tracking.</div>'; chartWrap.innerHTML=''; return; }
  const first=log[0].weight, latest=log[log.length-1].weight, delta=latest-first;
  statsEl.innerHTML = `
    <div class="stat"><div class="num">${latest}</div><div class="lbl">Current (kg)</div></div>
    <div class="stat"><div class="num">${first}</div><div class="lbl">Start (kg)</div></div>
    <div class="stat"><div class="num" style="color:${delta<=0?'var(--teal-1)':'var(--danger)'}">${delta>0?'+':''}${delta.toFixed(1)}</div><div class="lbl">Change (kg)</div></div>`;
  if (log.length<2){ chartWrap.innerHTML='<div class="empty-note">Log a couple more days to see a trend line.</div>'; return; }
  const weights=log.map(e=>e.weight);
  const min=Math.min(...weights), max=Math.max(...weights), range=(max-min)||1;
  const w=300,h=90,pad=10;
  const points = log.map((e,i)=>{
    const x=pad+(i/(log.length-1))*(w-pad*2);
    const y=pad+(1-(e.weight-min)/range)*(h-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  chartWrap.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="weight-svg" preserveAspectRatio="none"><polyline points="${points}" fill="none" style="stroke:var(--teal-1);stroke-width:2"/></svg>`;
}

/* ---------- WORKOUTS ---------- */
function renderWkEntries(){
  const list = document.getElementById('wkEntryList');
  if (wkEntries.length===0){ list.innerHTML='<div class="empty-note">No sets logged yet today.</div>'; return; }
  list.innerHTML = wkEntries.map((e,i)=>`
    <div class="entry"><div><div class="name">${e.name}</div><div class="meta">${e.sets} × ${e.reps} @ ${e.weight}kg</div></div>
    <button class="remove" data-i="${i}">×</button></div>`).join('');
  list.querySelectorAll('.remove').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      wkEntries.splice(Number(btn.dataset.i),1);
      await safeSet(`workout:${DATE_KEY}`, wkEntries);
      renderWkEntries();
    });
  });
}

async function addWkEntry(){
  const name = document.getElementById('wkName').value.trim();
  const sets = Number(document.getElementById('wkSets').value)||0;
  const reps = Number(document.getElementById('wkReps').value)||0;
  const weight = Number(document.getElementById('wkWeight').value)||0;
  if (!name) return;
  wkEntries.push({name,sets,reps,weight});
  await safeSet(`workout:${DATE_KEY}`, wkEntries);
  ['wkName','wkSets','wkReps','wkWeight'].forEach(id=>document.getElementById(id).value='');
  renderWkEntries();
  loadAndRenderPRs();
}

async function loadAndRenderPRs(){
  const keys = await safeList('workout:');
  const sortedKeys = keys.sort().slice(-60);
  const bests = {};
  for (const k of sortedKeys){
    const log = (await safeGet(k)) || [];
    log.forEach(e=>{
      const key=(e.name||'').trim().toLowerCase();
      if (!key) return;
      if (!bests[key] || e.weight>bests[key].weight) bests[key]={name:e.name,weight:e.weight,reps:e.reps};
    });
  }
  const prList = document.getElementById('prList');
  const names = Object.keys(bests);
  if (names.length===0){ prList.innerHTML='<div class="empty-note">Log a few sessions to see your bests.</div>'; return; }
  prList.innerHTML = names.sort().map(k=>{ const b=bests[k]; return `<div class="pr-row"><span>${b.name}</span><span class="best">${b.weight}kg × ${b.reps}</span></div>`; }).join('');
}

/* ---------- TABS & INIT ---------- */
let progressLoaded=false, workoutsLoaded=false;
const tabOrder = ['today','progress','workouts'];

function switchTab(name){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.add('hidden'));
  document.getElementById(`tab-${name}`).classList.remove('hidden');
  document.getElementById('navInd').style.transform = `translateX(${tabOrder.indexOf(name)*100}%)`;
  if (name==='progress') loadAndRenderProgress();
  if (name==='workouts') loadAndRenderPRs();
}

  document.getElementById('dateLabel').textContent = fmtDate();

  const storedGoals = await safeGet('goals');
  if (storedGoals) goals = storedGoals;
  fillGoalInputs();

  entries = (await safeGet(`foodlog:${DATE_KEY}`)) || [];
  checked = (await safeGet(`quest:${DATE_KEY}`)) || {};
  wkEntries = (await safeGet(`workout:${DATE_KEY}`)) || [];

  renderHero(); renderEntries(); renderTimeline(); renderWkEntries();
  refreshKeyStatus();
  loadFoodDB();
  document.getElementById('dbSearch').addEventListener('input', (e)=>{
    renderDbResults(searchFoodDB(e.target.value));
  });

  document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.tab)));
  document.getElementById('logMealBtn').addEventListener('click', ()=>{
    document.getElementById('foodLogSection').scrollIntoView({behavior:'smooth', block:'start'});
    document.getElementById('mealDesc').focus();
  });

  document.getElementById('heroTabOverview').addEventListener('click', ()=>{
    document.getElementById('heroTabOverview').classList.add('on');
    document.getElementById('heroTabMacros').classList.remove('on');
    document.getElementById('heroOverview').style.display='';
    document.getElementById('heroMacros').classList.remove('show');
  });
  document.getElementById('heroTabMacros').addEventListener('click', ()=>{
    document.getElementById('heroTabMacros').classList.add('on');
    document.getElementById('heroTabOverview').classList.remove('on');
    document.getElementById('heroOverview').style.display='none';
    document.getElementById('heroMacros').classList.add('show');
  });

  document.getElementById('addBtn').addEventListener('click', addEntry);
  document.getElementById('estimateBtn').addEventListener('click', estimateMeal);
  document.getElementById('manualToggle').addEventListener('click', ()=>document.getElementById('manualForm').classList.toggle('hidden'));
  document.getElementById('dbFallbackToggle').addEventListener('click', ()=>{
    document.getElementById('dbFallback').classList.toggle('hidden');
  });
  document.getElementById('keyLink').addEventListener('click', ()=>document.getElementById('keyset').classList.toggle('hidden'));
  document.getElementById('keyToggle').addEventListener('click', ()=>document.getElementById('apiKeyInput').focus());
  document.getElementById('saveKeyBtn').addEventListener('click', ()=>{
    const v = document.getElementById('apiKeyInput').value;
    if (v.trim()){ setApiKeyStored(v); document.getElementById('apiKeyInput').value=''; refreshKeyStatus(); document.getElementById('keyset').classList.add('hidden'); }
  });

  document.getElementById('photoBtn').addEventListener('click', ()=>document.getElementById('photoInput').click());
  document.getElementById('photoInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if (!file) return;
    const dataUrl = await resizeImageToBase64(file);
    attachedPhotoB64 = dataUrl;
    document.getElementById('photoThumb').src = dataUrl;
    document.getElementById('photoPreview').classList.add('show');
  });
  document.getElementById('clearPhoto').addEventListener('click', clearPhoto);

  document.getElementById('clearBtn').addEventListener('click', async ()=>{
    entries = []; await safeSet(`foodlog:${DATE_KEY}`, entries); renderEntries(); renderHero();
  });
  document.getElementById('goalsToggle').addEventListener('click', ()=>document.getElementById('goalsPanel').classList.toggle('hidden'));
  document.getElementById('saveGoals').addEventListener('click', async ()=>{
    goals = {
      cal:Number(document.getElementById('gCal').value)||DEFAULT_GOALS.cal,
      pro:Number(document.getElementById('gPro').value)||DEFAULT_GOALS.pro,
      carb:Number(document.getElementById('gCarb').value)||DEFAULT_GOALS.carb,
      fat:Number(document.getElementById('gFat').value)||DEFAULT_GOALS.fat,
      fiber:Number(document.getElementById('gFiber').value)||DEFAULT_GOALS.fiber
    };
    await safeSet('goals', goals);
    document.getElementById('goalsPanel').classList.add('hidden');
    renderHero();
  });

  document.getElementById('logWeightBtn').addEventListener('click', logWeight);
  document.getElementById('wkAddBtn').addEventListener('click', addWkEntry);
}

init();
</script>
